<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SysFinan — Extração de Dados de Nota Fiscal</title>
    <meta name="description" content="SysFinan — Sistema de Controle Financeiro" />
    <!-- ICO como reserva; o SVG (que acompanha o tema claro/escuro) vence nos navegadores atuais. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f5f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b11" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica o tema antes da primeira pintura, para nao piscar branco no modo escuro.
      (function () {
        var salvo = localStorage.getItem('sysfinan:tema')
        document.documentElement.dataset.tema =
          salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
