<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SysFinan — Extração de Dados de Nota Fiscal</title>
    <script>
      // Aplica o tema antes da primeira pintura, para nao piscar branco no modo escuro.
      (function () {
        var salvo = localStorage.getItem('sysfinan:tema')
        document.documentElement.dataset.tema =
          salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
